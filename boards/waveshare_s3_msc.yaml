id: waveshare_s3_msc
name: Waveshare ESP32-S3-AUDIO (USB MSC)
note: OTG CDC + mass storage
target: esp32s3
help: |
  Waveshare ESP32-S3-AUDIO with TinyUSB OTG CDC dev sync and mass storage on one
  cable (cu.usbmodem* on macOS — same port for monitor, espd_sync, and the USB
  drive). On first power-on with internal flash as the patch store, the board
  shows a USB volume so you can copy main.pd and config.txt; eject on the host
  to start Pd. After that, sync uses CDC PUT/RELOAD on the same port.
  Serial logs are plain text on cu.usbmodem* (web flasher monitor, screen,
  miniterm) — not idf.py monitor, which expects USB Serial JTAG and is disabled
  on this board. No USB MIDI — use waveshare_s3_midi. For USB Serial JTAG sync
  without MSC, use waveshare_s3. Web flasher: hold BOOT, tap RESET, release BOOT
  when prompted.

bsp:
  component: waveshare_esp32_s3_audio
  git: https://github.com/ben-wes/esp-bsp.git
  path: bsp/waveshare_esp32_s3_audio
  version: espd-bsp

features:
  imply:
    - ESPD_USE_ADC
    - ESPD_USE_SDCARD
    - ESPD_USE_AIN
    - ESPD_USE_AOUT
    - ESPD_USE_WIFI
    - ESPD_USE_USB_OTG
    - ESPD_USE_USB_MSC

io:
  buttons: [VOLUP, PLAY, VOLDOWN]
