id: esp32_dac
name: ESP32 Internal DAC
note: GPIO25/26
target: esp32
generic: true
help: |
  Classic ESP32 built-in DAC (GPIO25/26) for dac~ output. No external codec;
  adc~ capture is not available on this backend. WiFi + ESP-NOW for peer
  testing with kit boards (e.g. waveshare_s3).

features:
  imply:
    - ESPD_USE_WIFI
    - ESPD_USE_ESPNOW

profile:
  Audio:
    ESPD_AUDIO_BACKEND_DAC: y
